services:
  backend:
    container_name: owvds-backend       # Tên riêng không đụng với nhánh cũ
    build: .
    ports:
      - "8002:8000"                     # Đổi port host sang 8002 (nhánh kia là 8001)
    volumes:
      - .:/app
      - ./static:/app/static
    env_file:                           # <--- Tự động nạp toàn bộ biến từ file .env
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    container_name: owvds-db            # Tên riêng cho DB
    image: mysql:8.4
    restart: always
    env_file:                           # <--- Tự động nạp MYSQL_ROOT_PASSWORD và MYSQL_DATABASE
      - .env
    ports:
      - "3308:3306"                     # Đổi port host sang 3308 (nhánh kia là 3307)
    volumes:
      - mysql_data_owvds:/var/lib/mysql # <--- Volume mới hoàn toàn cho schema của owvds
    healthcheck:
      # Dùng $$MYSQL_ROOT_PASSWORD để Docker lấy biến môi trường bên trong container, 
      # giúp bạn không bị lộ mật khẩu rành rành trong file này.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data_owvds:                     # Khai báo volume độc lập mới